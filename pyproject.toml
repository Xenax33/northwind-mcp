[project]
name = "northwind-mcp"
version = "0.1.0"
description = "MCP server and web host exposing the Northwind trading database to AI assistants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "mcp>=2.3.0",
    "openai>=3.57.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
northwind-mcp = "northwind_mcp:main"
northwind-host = "northwind_host.app:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["northwind_mcp", "northwind_host"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
