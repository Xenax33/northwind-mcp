[project]
name = "northwind-mcp"
version = "0.1.0"
description = "MCP server and web host exposing the Northwind trading database to AI assistants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
northwind-mcp = "northwind_mcp:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
